<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concall Pulse | Real-Time NSE/BSE Earnings Signal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  <!-- Top Bar -->
  <header class="border-b border-slate-800 bg-slate-900/90 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-emerald-400 font-mono font-bold text-lg tracking-tight">CONCALL PULSE</span>
      <span class="text-xs text-slate-400 border-l border-slate-700 pl-3">NSE + BSE Real-Time Transcript Intelligence</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="ws-status" class="inline-flex items-center gap-2 text-xs font-mono px-2.5 py-1 rounded bg-slate-800 text-amber-400">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting WS...
      </span>
      <button onclick="triggerPoll()" id="poll-btn" class="text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded transition">
        Scan Filings Now
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 grid grid-cols-12 overflow-hidden">
    <!-- Left Sidebar: Processed Filings -->
    <aside class="col-span-12 md:col-span-4 lg:col-span-3 border-r border-slate-800 bg-slate-900/40 overflow-y-auto p-4 space-y-2">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Processed Calls (<span id="count">0</span>)</h2>
      </div>
      <div id="filing-list" class="space-y-2">
        <p class="text-xs text-slate-500">Watching NSE & BSE feeds for transcripts...</p>
      </div>
    </aside>

    <!-- Right Panel: Summary Reader -->
    <main class="col-span-12 md:col-span-8 lg:col-span-9 overflow-y-auto p-6">
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500 text-sm">
        <p>Select an earnings call from the left feed, or wait for the live watcher to ingest incoming transcripts.</p>
      </div>
      <div id="detail-view" class="hidden max-w-4xl mx-auto space-y-6"></div>
    </main>
  </div>

  <script>
    let filings = [];
    let selectedId = null;
    let viewMode = 'structured'; // 'structured' | 'json' | 'markdown'

    function toneBadge(tone) {
      const map = {
        'Bullish': 'bg-emerald-950 text-emerald-300 border-emerald-700',
        'Cautiously Optimistic': 'bg-teal-950 text-teal-300 border-teal-700',
        'Neutral': 'bg-slate-800 text-slate-300 border-slate-600',
        'Defensive': 'bg-amber-950 text-amber-300 border-amber-700',
        'Cautious': 'bg-rose-950 text-rose-300 border-rose-700'
      };
      return map[tone] || 'bg-slate-800 text-slate-300 border-slate-700';
    }

    function renderSidebar() {
      document.getElementById('count').textContent = filings.length;
      const list = document.getElementById('filing-list');
      if (!filings.length) return;
      list.innerHTML = filings.map(f => {
        const s = f.summary_json;
        const active = f.id === selectedId ? 'border-emerald-500 bg-slate-800/90' : 'border-slate-800 bg-slate-900/60 hover:border-slate-700';
        return `
          <div onclick="selectFiling(${f.id})" class="cursor-pointer border rounded-lg p-3 transition ${active}">
            <div class="flex items-center justify-between">
              <span class="font-mono font-bold text-sm text-white">${f.nse_symbol}</span>
              <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">${s.quarter || ''}</span>
            </div>
            <p class="text-xs text-slate-400 truncate mt-0.5">${f.company}</p>
            <div class="flex items-center justify-between mt-2 text-[11px] text-slate-500">
              <span>${f.call_date} · ${f.source}</span>
              <span class="px-1.5 py-0.2 rounded border text-[10px] ${toneBadge(s.management_tone)}">${s.management_tone || 'Neutral'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectFiling(id) {
      selectedId = id;
      renderSidebar();
      const item = filings.find(f => f.id === id);
      if (!item) return;
      document.getElementById('empty-state').classList.add('hidden');
      const container = document.getElementById('detail-view');
      container.classList.remove('hidden');
      const s = item.summary_json;

      const tabs = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <div>
            <div class="flex items-center gap-2.5">
              <h1 class="text-xl font-bold text-white">${item.company}</h1>
              <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-emerald-400">${s.quarter}</span>
              <span class="text-xs px-2 py-0.5 rounded border ${toneBadge(s.management_tone)}">${s.management_tone}</span>
            </div>
            <p class="text-xs text-slate-400 mt-1">
              NSE: <span class="font-mono text-slate-200">${item.nse_symbol}</span> ·
              BSE: <span class="font-mono text-slate-200">${item.scrip_code}</span> ·
              Date: ${item.call_date} ·
              <a href="${item.source_url}" target="_blank" class="text-emerald-400 underline">Original Filing PDF (${item.source})</a>
            </p>
          </div>
          <div class="flex gap-1 bg-slate-900 p-1 rounded border border-slate-800 text-xs">
            <button onclick="setMode('structured')" class="px-2.5 py-1 rounded ${viewMode==='structured'?'bg-slate-700 text-white':'text-slate-400'}">Brief</button>
            <button onclick="setMode('markdown')" class="px-2.5 py-1 rounded ${viewMode==='markdown'?'bg-slate-700 text-white':'text-slate-400'}">Markdown</button>
            <button onclick="setMode('json')" class="px-2.5 py-1 rounded ${viewMode==='json'?'bg-slate-700 text-white':'text-slate-400'}">JSON</button>
          </div>
        </div>
      `;

      if (viewMode === 'json') {
        container.innerHTML = tabs + `<pre class="bg-slate-900 border border-slate-800 rounded-lg p-4 text-xs font-mono text-emerald-300 overflow-x-auto">${escapeHtml(JSON.stringify(s, null, 2))}</pre>`;
        return;
      }
      if (viewMode === 'markdown') {
        container.innerHTML = tabs + `<pre class="bg-slate-900 border border-slate-800 rounded-lg p-4 text-xs font-mono text-slate-200 whitespace-pre-wrap">${escapeHtml(item.summary_md)}</pre>`;
        return;
      }

      container.innerHTML = tabs + `
        <section class="bg-slate-900/70 border border-slate-800 rounded-lg p-4">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-2">TL;DR (20-Second Analyst Brief)</h3>
          <ul class="list-disc list-inside space-y-1.5 text-sm text-slate-200">
            ${(s.tldr || []).map(x => `<li>${escapeHtml(x)}</li>`).join('')}
          </ul>
        </section>

        <section>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Key Numbers Called Out</h3>
          <div class="overflow-x-auto border border-slate-800 rounded-lg">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                <tr><th class="p-2.5">Metric</th><th class="p-2.5">Value</th><th class="p-2.5">Context</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-800/70">
                ${(s.key_metrics || []).map(m => `
                  <tr class="bg-slate-950/40">
                    <td class="p-2.5 font-medium text-slate-200">${escapeHtml(m.metric)}</td>
                    <td class="p-2.5 font-mono font-bold text-emerald-400">${escapeHtml(m.value)}</td>
                    <td class="p-2.5 text-slate-400">${escapeHtml(m.context)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <section class="bg-slate-900/50 border border-slate-800 rounded-lg p-4">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Management Commentary</h3>
            <ul class="list-disc list-inside space-y-1.5 text-xs text-slate-300">
              ${(s.management_commentary || []).map(x => `<li>${escapeHtml(x)}</li>`).join('')}
            </ul>
          </section>
          <section class="bg-slate-900/50 border border-slate-800 rounded-lg p-4">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Guidance & Outlook</h3>
            <ul class="list-disc list-inside space-y-1.5 text-xs text-slate-300">
              ${(s.guidance && s.guidance.length ? s.guidance : ['No explicit quantitative guidance provided on this call.']).map(x => `<li>${escapeHtml(x)}</li>`).join('')}
            </ul>
          </section>
        </div>

        <section class="bg-slate-900/50 border border-slate-800 rounded-lg p-4">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Segment / Vertical Performance</h3>
          <div class="space-y-2 text-xs">
            ${(s.segment_performance || []).map(seg => `
              <div><span class="font-semibold text-slate-200">${escapeHtml(seg.segment)}:</span> <span class="text-slate-300">${escapeHtml(seg.notes)}</span></div>
            `).join('')}
          </div>
        </section>

        <section class="space-y-3">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Notable Analyst Q&A</h3>
          ${(s.notable_qa || []).map(qa => `
            <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-3.5 text-xs space-y-1.5">
              <p class="font-semibold text-amber-300">Q (${escapeHtml(qa.asked_by)}): ${escapeHtml(qa.question)}</p>
              <p class="text-slate-300 leading-relaxed"><span class="font-semibold text-emerald-400">Management:</span> ${escapeHtml(qa.answer)}</p>
            </div>
          `).join('')}
        </section>

        <section class="bg-rose-950/20 border border-rose-900/40 rounded-lg p-4">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-rose-400 mb-2">Risks & Concerns Flagged</h3>
          <ul class="list-disc list-inside space-y-1 text-xs text-slate-300">
            ${(s.risks || []).map(r => `<li>${escapeHtml(r)}</li>`).join('')}
          </ul>
        </section>
      `;
    }

    function setMode(m) { viewMode = m; selectFiling(selectedId); }
    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadInitial() {
      const res = await fetch('/api/filings');
      const data = await res.json();
      filings = data.filings || [];
      renderSidebar();
      if (filings.length && !selectedId) selectFiling(filings[0].id);
    }

    async function triggerPoll() {
      const btn = document.getElementById('poll-btn');
      btn.disabled = true;
      btn.textContent = 'Scanning...';
      try {
        await fetch('/api/poll-now', { method: 'POST' });
        await loadInitial();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Scan Filings Now';
      }
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      const badge = document.getElementById('ws-status');
      ws.onopen = () => {
        badge.className = 'inline-flex items-center gap-2 text-xs font-mono px-2.5 py-1 rounded bg-emerald-950 text-emerald-300 border border-emerald-800';
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> WS LIVE (/ws)';
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.event === 'new_summary' && msg.data) {
          filings = [msg.data, ...filings.filter(f => f.id !== msg.data.id)];
          renderSidebar();
          selectFiling(msg.data.id);
        }
      };
      ws.onclose = () => {
        badge.className = 'inline-flex items-center gap-2 text-xs font-mono px-2.5 py-1 rounded bg-rose-950 text-rose-300';
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400"></span> WS Reconnecting...';
        setTimeout(connectWS, 3000);
      };
    }

    loadInitial();
    connectWS();
  </script>
</body>
</html>
